# ============================================================
# nginx 站点配置：yjgnet.cn
# 部署位置：/etc/nginx/sites-available/yjgnet.cn
# 启用方式：ln -s /etc/nginx/sites-available/yjgnet.cn /etc/nginx/sites-enabled/
# 说明：本文件为 2026-09-11 certbot --nginx 签发 HTTPS 后的线上版本，
#       443 与证书部分由 Certbot 自动管理（managed by Certbot）。
#       若在全新服务器重新部署：先删除下方 443/ssl_* 相关行（含 include 与
#       ssl_dhparam），配置只有 80 端口，待 certbot --nginx 签发后会自动补回。
# ============================================================

server {
    server_name yjgnet.cn www.yjgnet.cn;
    server_tokens off;  # 隐藏 nginx 版本号，减少信息暴露

    # 访问/错误日志（Ubuntu 自带 logrotate 自动轮转清理）
    access_log /var/log/nginx/yjgnet.access.log;
    error_log /var/log/nginx/yjgnet.error.log warn;

    # 静态资源由 nginx 直接服务（绕过应用，性能更好）
    location /static/ {
        alias /opt/homepage/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 应用反向代理
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式接口（AI 助手）必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yjgnet.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yjgnet.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.yjgnet.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = yjgnet.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name yjgnet.cn www.yjgnet.cn;
    server_tokens off;
    return 404; # managed by Certbot
}
